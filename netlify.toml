[build]
  command = "npm run brand:check && npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Next's static export writes privacy.html, terms.html and so on. These keep
# the clean URLs explicit rather than relying on Netlify's Pretty URLs setting.

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
